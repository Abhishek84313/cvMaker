name: macOS Debug Flow

on:
  push:
    branches:
      - T-fix/mac-build

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Environment
        run: |
          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

      - name: Install dependencies
        run: npm ci

      - name: Inspect raw Electron
        run: |
          echo "=== ELECTRON VERSION ==="
          npx electron --version
          npm list electron

          echo ""
          echo "=== RAW ELECTRON APP ==="
          codesign -dv --verbose=4 \
            node_modules/electron/dist/Electron.app 2>&1 || true

          echo ""
          echo "=== RAW ELECTRON FRAMEWORK ==="
          codesign -dv --verbose=4 \
            "node_modules/electron/dist/Electron.app/Contents/Frameworks/Electron Framework.framework" 2>&1 || true

          echo ""
          echo "=== VERIFY RAW ELECTRON ==="
          codesign --verify --deep --strict --verbose=4 \
            node_modules/electron/dist/Electron.app

      - name: Run Forge Make
        run: npm run make

      - name: Find generated files
        run: |
          echo "=== OUT DIRECTORY ==="
          find out -maxdepth 6 -print

      - name: Inspect macOS app
        run: |
          set +e

          APP=$(find out -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "========================================"
          echo "APP: $APP"
          echo "========================================"

          echo ""
          echo "=== FILE ==="
          file "$APP"

          echo ""
          echo "=== CODE SIGN INFO ==="
          codesign -dv --verbose=4 "$APP" || true

          codesign --verify --deep --strict --verbose=4 "$APP"
          APP_CODE=$?
          echo "APP VERIFY EXIT CODE: $APP_CODE"

          codesign --verify --strict --verbose=4 \
          "$APP/Contents/Frameworks/Electron Framework.framework"
          FRAMEWORK_CODE=$?
          echo "FRAMEWORK EXIT CODE: $FRAMEWORK_CODE"

          codesign --verify --strict --verbose=4 \
          "$APP/Contents/Frameworks/cv-maker Helper.app"
          HELPER_CODE=$?
          echo "HELPER EXIT CODE: $HELPER_CODE"

          codesign --verify --strict --verbose=4 \
          "$APP/Contents/Frameworks/cv-maker Helper (Renderer).app"
          RENDERER_CODE=$?
          echo "RENDERER EXIT CODE: $RENDERER_CODE"

          codesign --verify --strict --verbose=4 \
          "$APP/Contents/Frameworks/cv-maker Helper (GPU).app"
          GPU_CODE=$?
          echo "GPU EXIT CODE: $GPU_CODE"

          spctl --assess --type execute --verbose=4 "$APP"
          SPCTL_CODE=$?
          echo "SPCTL EXIT CODE: $SPCTL_CODE"

          echo ""
          echo "========================================"
          echo "SUMMARY"
          echo "========================================"
          echo "APP:        $APP_CODE"
          echo "FRAMEWORK:  $FRAMEWORK_CODE"
          echo "HELPER:     $HELPER_CODE"
          echo "RENDERER:   $RENDERER_CODE"
          echo "GPU:        $GPU_CODE"
          echo "SPCTL:      $SPCTL_CODE"

          echo ""
          echo "=== QUARANTINE ==="
          xattr -lr "$APP" || true

          echo ""
          echo "=== NATIVE BINARIES ==="
          find "$APP" -type f \( -name "*.node" -o -name "*.dylib" \) -exec file {} \;

          echo ""
          echo "=== EXECUTABLE ==="
          file "$APP/Contents/MacOS/"*

          echo ""
          echo "=== INFO.PLIST ==="
          plutil -p "$APP/Contents/Info.plist"

          echo ""
          echo "=== PLIST IDENTIFIERS ==="
          echo "CFBundleIdentifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"

          echo ""
          echo "CFBundleExecutable:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist"

          echo ""
          echo "CFBundleName:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist"

          echo ""
          echo "=== MACH-O IDENTIFIER ==="
          codesign -dv --verbose=4 "$APP" 2>&1 | grep Identifier
      - name: Launch app
        run: |
            APP=$(find out -name "*.app" -print -quit)

            echo "Launching $APP"

            "$APP/Contents/MacOS/"* &
            PID=$!

            sleep 10

            if kill -0 $PID 2>/dev/null; then
                echo "App is still running"
                kill $PID
            else
                echo "App exited"
                exit 1
            fi